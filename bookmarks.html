<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Bookmarks – ExamQuest</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="eq-navbar">
    <div class="container-fluid d-flex align-items-center justify-content-between">
      <a href="index.html" class="eq-brand">
        <div class="eq-brand-icon"><img src="assets/images/logo.svg" alt="ExamQuest Logo"></div>
        <div class="eq-brand-text">
          <span class="eq-brand-name">ExamQuest</span>
          <span class="eq-brand-tagline">Practice. Learn. Succeed.</span>
        </div>
      </a>

      <nav class="d-none d-lg-block">
        <ul class="eq-nav-links" id="eqNavLinks">
          <li class="eq-nav-item"><a href="index.html" class="eq-nav-link">Dashboard</a></li>
          <li class="eq-nav-item"><a href="practice.html" class="eq-nav-link">Practice</a></li>
          <li class="eq-nav-item"><a href="mock-test.html" class="eq-nav-link">Mock Tests</a></li>
          <li class="eq-nav-item"><a href="topics.html" class="eq-nav-link">Topics</a></li>
          <li class="eq-nav-item active"><a href="bookmarks.html" class="eq-nav-link">Bookmarks</a></li>
          <li class="eq-nav-item"><a href="performance.html" class="eq-nav-link">My Performance</a></li>
        </ul>
      </nav>

      <div class="eq-nav-actions">
        <button class="eq-icon-btn" id="themeToggleBtn" aria-label="Toggle Dark Mode"><i class="fa-regular fa-moon"></i></button>
        <button class="eq-icon-btn" aria-label="Notifications"><i class="fa-regular fa-bell"></i></button>
        <div class="eq-user-avatar"><i class="fa-regular fa-user"></i></div>
      </div>
    </div>
  </header>

  <main class="eq-main-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1">Bookmarked Questions</h2>
        <p class="text-muted mb-0">Review difficult questions saved during your practice sessions.</p>
      </div>
      <button class="btn btn-outline-danger btn-sm rounded-3" id="clearAllBookmarks">
        <i class="fa-regular fa-trash-can me-1"></i> Clear All
      </button>
    </div>

    <div id="bookmarksContainer" class="d-flex flex-column gap-3">
      <!-- Injected by script -->
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderBookmarks();

      document.getElementById('clearAllBookmarks').addEventListener('click', () => {
        if (confirm("Are you sure you want to remove all bookmarked questions?")) {
          ExamQuestData.saveBookmarks([]);
          renderBookmarks();
          showToast("All bookmarks cleared.", "info");
        }
      });
    });

    function renderBookmarks() {
      const container = document.getElementById('bookmarksContainer');
      const bookmarks = ExamQuestData.getBookmarks();
      container.innerHTML = '';

      if (bookmarks.length === 0) {
        container.innerHTML = `
          <div class="eq-card text-center p-5">
            <i class="fa-regular fa-bookmark text-muted mb-3" style="font-size: 3rem;"></i>
            <h4 class="fw-bold text-dark mb-2">No Bookmarks Saved Yet</h4>
            <p class="text-muted mb-4">You can bookmark questions while practicing to revise them anytime.</p>
            <a href="practice.html" class="btn btn-primary px-4 py-2 rounded-3 fw-medium">Go to Practice</a>
          </div>
        `;
        return;
      }

      bookmarks.forEach(qId => {
        const q = ExamQuestData.getQuestionById(qId);
        const card = document.createElement('div');
        card.className = 'eq-card';
        card.innerHTML = `
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="badge bg-primary-subtle text-primary">Question ${q.id} • ${q.subject}</span>
            <button class="btn btn-sm btn-outline-danger" onclick="removeBookmark(${q.id})">
              <i class="fa-solid fa-trash-can me-1"></i> Remove
            </button>
          </div>
          <h5 class="fw-bold mb-3 text-dark">${q.id}. ${q.question}</h5>
          <div class="row g-2 mb-3">
            ${q.options.map((opt, i) => `
              <div class="col-md-6">
                <div class="p-2 border rounded small bg-light text-dark">
                  <strong>${String.fromCharCode(65 + i)}.</strong> ${opt}
                </div>
              </div>
            `).join('')}
          </div>
          <div class="d-flex justify-content-end">
            <button class="btn btn-primary btn-sm px-4 rounded-3" onclick="openQuestionInPractice(${q.id})">
              <i class="fa-solid fa-arrow-up-right-from-square me-1"></i> Practice This Question
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function removeBookmark(id) {
      let bookmarks = ExamQuestData.getBookmarks();
      bookmarks = bookmarks.filter(b => b !== id);
      ExamQuestData.saveBookmarks(bookmarks);
      renderBookmarks();
      showToast(`Question ${id} removed from bookmarks.`, 'info');
    }

    function openQuestionInPractice(id) {
      const session = ExamQuestData.loadSession();
      session.currentQuestionId = id;
      ExamQuestData.saveSession(session);
      window.location.href = "practice.html";
    }
  </script>
</body>
</html>
